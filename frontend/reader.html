<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Reader</title><link rel="stylesheet" href="/css/style.css"></head><body><nav></nav><main class="container"><div class="reader"><div id="head"></div><div id="page" class="page"></div><div class="actions"><button id="prev">Previous</button><span id="num"></span><button id="next">Next</button></div></div></main><script src="/js/api.js"></script><script src="/js/nav.js"></script><script>
requireLogin();const id=new URLSearchParams(location.search).get('id');let book,shelf,page=0;
async function init(){book=await apiFetch('/books/'+id);shelf=await apiFetch('/shelf/book/'+id);if(!shelf){await apiFetch('/shelf/'+id,{method:'POST'});shelf=await apiFetch('/shelf/book/'+id)}page=shelf.lastPage||0;render()}
function render(){head.innerHTML=`<h1>${book.title}</h1><p>Continuing from Page ${page||1}. Status: ${shelf.status}</p>`;let p=book.pages[page];document.getElementById('page').innerHTML=`<h2>${p.title}</h2><p>${p.content}</p>`;num.textContent=`Page ${page+1} of ${book.pages.length}`;prev.disabled=page<=0;next.disabled=page>=book.pages.length-1}
async function move(n){let np=Math.max(0,Math.min(19,page+n));if(np===page)return;page=np;shelf=await apiFetch('/shelf/'+shelf._id,{method:'PUT',body:JSON.stringify({page})});render()}prev.onclick=()=>move(-1);next.onclick=()=>move(1);init();
</script></body></html>
