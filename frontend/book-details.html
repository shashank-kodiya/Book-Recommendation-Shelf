<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Details</title><link rel="stylesheet" href="/css/style.css"></head><body><nav></nav><main class="container"><div id="view"></div><h2>Reviews</h2><div id="reviews"></div></main><script src="/js/api.js"></script><script src="/js/nav.js"></script><script>
const id=new URLSearchParams(location.search).get('id');
async function load(){let b=await apiFetch('/books/'+id);let cover=b.cover?`<img class="book-detail-cover" src="${b.cover}" alt="Cover of ${b.title}">`:`<div class="cover">${b.title}</div>`;view.innerHTML=`<div class="card">${cover}<h1>${b.title}</h1><p>${b.author} · ${b.genre} · 20 pages</p><p>${b.description}</p><p>⭐ ${b.averageRating}</p>${token()?'<button onclick="add()">Add to Shelf</button> <a class="btn" href="/reader.html?id='+id+'">Start Reading</a>':'<a class="btn" href="/login.html">Login to use shelf</a>'}</div>`;let rs=await apiFetch('/reviews/book/'+id);reviews.innerHTML=rs.length?rs.map(r=>`<div class="card"><b>${r.userId?.name||'Reader'}</b> · ⭐ ${r.rating}<p>${r.review||''}</p></div>`).join(''):'<p>No reviews yet.</p>'}
async function add(){await apiFetch('/shelf/'+id,{method:'POST'});location.href='/shelf.html'}load();
</script></body></html>
