<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><nav></nav><main class="container"><h1>Admin Dashboard</h1><h2>Users</h2><div id="users"></div><h2>All Shelf Activity</h2><div id="activity"></div></main><script src="/js/api.js"></script><script src="/js/nav.js"></script><script>requireLogin();async function load(){try{let u=await apiFetch('/admin/users'),a=await apiFetch('/admin/activity');users.innerHTML='<table><tr><th>Name</th><th>Email</th><th>Status</th></tr>'+u.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.isOnline?'Online':'Offline'}</td></tr>`).join('')+'</table>';activity.innerHTML='<table><tr><th>User</th><th>Book</th><th>Status</th><th>Progress</th></tr>'+a.map(x=>`<tr><td>${x.userId?.name}</td><td>${x.bookId?.title}</td><td>${x.status}</td><td>${x.lastPage}/${x.bookId?.totalPages||20}</td></tr>`).join('')+'</table>'}catch(e){activity.innerHTML='<p class="error">'+e.message+'</p>'}}load()</script></body></html>
