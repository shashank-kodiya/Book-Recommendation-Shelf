<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recommendations</title><link rel="stylesheet" href="/css/style.css"></head><body><nav></nav><main class="container"><h1>Recommendations</h1><p>Recommendations are rule-based, not AI-generated.</p><div id="list" class="grid"></div></main><script src="/js/api.js"></script><script src="/js/nav.js"></script><script>requireLogin();apiFetch('/recommendations').then(rs=>list.innerHTML=rs.map(x=>`<div class="card"><h3>${x.book.title}</h3><p>${x.book.genre} · ⭐ ${x.book.averageRating}</p><p>${x.reason}</p><a class="btn" href="/reader.html?id=${x.book._id}">Read</a></div>`).join(''))</script></body></html>
