<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/css/style.css"></head><body><nav></nav><main class="container"><div class="card" style="max-width:480px;margin:auto"><h1>Login</h1><form id="f"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><p id="msg"></p></div></main><script src="/js/api.js"></script><script src="/js/nav.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{let d=await apiFetch('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});localStorage.token=d.token;localStorage.isAdmin=d.user.isAdmin;location.href='/dashboard.html'}catch(x){msg.textContent=x.message;msg.className='error'}}</script></body></html>
