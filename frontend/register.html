<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/css/style.css"></head><body><nav></nav><main class="container"><div class="card" style="max-width:480px;margin:auto"><h1>Create Account</h1><form id="f"><input id="name" placeholder="Name" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Register</button></form><p id="msg"></p></div></main><script src="/js/api.js"></script><script src="/js/nav.js"></script><script>
document.getElementById('f').addEventListener('submit', async event => {
	event.preventDefault();
	const nameInput = document.getElementById('name');
	const emailInput = document.getElementById('email');
	const passwordInput = document.getElementById('password');
	const message = document.getElementById('msg');

	try {
		const data = await apiFetch('/auth/register', {
			method: 'POST',
			body: JSON.stringify({
				name: nameInput.value.trim(),
				email: emailInput.value.trim(),
				password: passwordInput.value
			})
		});
		localStorage.token = data.token;
		localStorage.isAdmin = data.user.isAdmin;
		location.href = '/dashboard.html';
	} catch (error) {
		message.textContent = error.message;
		message.className = 'error';
	}
});
</script></body></html>
