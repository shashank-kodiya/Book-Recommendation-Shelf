<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics</title><link rel="stylesheet" href="/css/style.css"></head><body><nav></nav><main class="container"><h1>My Reading Analytics</h1><div id="view" class="grid"></div></main><script src="/js/api.js"></script><script src="/js/nav.js"></script><script>requireLogin();apiFetch('/analytics').then(d=>{view.innerHTML=`<div class="stat"><h2>${d.books}</h2><p>Shelf Books</p></div><div class="stat"><h2>${d.pages}</h2><p>Pages Read</p></div><div class="stat"><h2>${d.completed}</h2><p>Completed</p></div>`})</script></body></html>
