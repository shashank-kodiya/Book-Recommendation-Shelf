<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse Books</title><link rel="stylesheet" href="/css/style.css"></head><body><nav></nav><main class="container"><h1>Browse Books</h1><div class="card"><input id="search" placeholder="Search title or author"><select id="genre"><option value="">All genres</option></select></div><div id="list" class="grid" style="margin-top:18px"></div></main><script src="/js/api.js"></script><script src="/js/nav.js"></script><script>
async function load(){let q=search.value?('?search='+encodeURIComponent(search.value)):(genre.value?'?genre='+encodeURIComponent(genre.value):'');let bs=await apiFetch('/books'+q);list.innerHTML=bs.map(b=>`<div class="card">${b.cover?`<img class="book-card-cover" src="${b.cover}" alt="Cover of ${b.title}" loading="lazy">`:`<div class="cover">${b.title}</div>`}<h3>${b.title}</h3><p class="muted">${b.author} · ${b.genre}</p><p>${b.description}</p><p>⭐ ${b.averageRating} · 20 pages</p><a class="btn" href="/book-details.html?id=${b._id}">View Book</a></div>`).join('')}
async function init(){genre.innerHTML+=[...new Set((await apiFetch('/books')).map(b=>b.genre))].sort().map(g=>`<option>${g}</option>`).join('');load()}
search.oninput=load;genre.onchange=load;init();
</script></body></html>
